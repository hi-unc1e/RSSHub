name: 'Docker Release (GHCR only)'

on:
    push:
        branches:
            - master
        paths:
            - '.github/workflows/docker-release-ghcr.yml'
            - 'lib/**'
            - '!lib/**/*.test.ts'
            - 'Dockerfile'
    workflow_dispatch: {}

jobs:
    build:
        runs-on: ${{ matrix.runner }}
        timeout-minutes: 40
        strategy:
            fail-fast: false
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-latest
                    - platform: linux/arm64
                      runner: ubuntu-26.04-arm
        permissions:
            contents: read
            packages: write
        steps:
            - name: Compute lowercase image name
              run: echo "IMAGE_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

            - name: Prepare
              run: |
                  platform=${{ matrix.platform }}
                  echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV

            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v6
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  outputs: type=image,name=${{ env.IMAGE_LC }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=docker-release-${{ env.PLATFORM_PAIR }}
                  cache-to: type=gha,mode=max,scope=docker-release-${{ env.PLATFORM_PAIR }}

            - name: Export digest
              run: |
                  mkdir -p ${{ runner.temp }}/digests
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"

            - name: Upload digest
              uses: actions/upload-artifact@v4
              with:
                  name: digests-${{ env.PLATFORM_PAIR }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    merge:
        runs-on: ubuntu-latest
        needs: build
        timeout-minutes: 10
        permissions:
            contents: read
            packages: write
        steps:
            - name: Compute lowercase image name
              run: echo "IMAGE_LC=ghcr.io/${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

            - name: Download digests
              uses: actions/download-artifact@v4
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            - name: Log in to the Container registry
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.IMAGE_LC }}
                  tags: |
                      type=raw,value=latest,enable=true
                      type=raw,value={{date 'YYYY-MM-DD'}},enable=true
                      type=sha,format=long,prefix=,enable=true
                  flavor: latest=false

            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                      $(printf "${IMAGE_LC}@sha256:%s " *)

            - name: Inspect image
              run: docker buildx imagetools inspect "${{ env.IMAGE_LC }}:latest"

            - name: Set package visibility to public (best effort)
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh api -X PATCH "/user/packages/container/${GITHUB_REPOSITORY#*/}" \
                      -H "Accept: application/vnd.github+json" \
                      -f visibility='public' || echo "visibility patch failed — set public manually if image is private"
